name: Node.js CI

on:
  push:
    branches: ["main"]
    paths:
      - "packages/shared/**"
      - "packages/api/**"
      - ".github/workflows/node.js.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/shared/**"
      - "packages/api/**"
      - ".github/workflows/node.js.yml"

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API tests
        run: pnpm --filter api test
