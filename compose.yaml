# Dev: docker compose up --build -w  (Compose Watch syncs sources; use -w for hot reload)
# Source bind mounts are intentionally omitted so watch can sync host edits into the containers.

services:
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    env_file:
      - ./.env
    environment:
      PORT: ${WEB_PORT:-5173}
      # Browser calls the API on the host-mapped port (not the Docker service name)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3010}
      # Bind-mount FS events are unreliable on Windows/macOS; polling backs up Compose Watch sync
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./packages/web
          target: /monorepo/packages/web
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /monorepo/packages/shared
          ignore:
            - node_modules/
        - action: sync
          path: ./tsconfig.base.json
          target: /monorepo/tsconfig.base.json
        - action: rebuild
          path: ./packages/web/package.json
        - action: rebuild
          path: ./packages/shared/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "${API_PORT:-3010}:3010"
    env_file:
      - ./.env
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Helps tsx watch detect synced file changes on Windows/macOS Docker volumes
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./packages/api
          target: /monorepo/packages/api
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /monorepo/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/api/package.json
        - action: rebuild
          path: ./packages/shared/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: sync
          path: ./tsconfig.base.json
          target: /monorepo/tsconfig.base.json
