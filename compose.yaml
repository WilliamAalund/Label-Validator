# Dev: docker compose watch  (hot-reload via Compose Watch + tsx watch in the API image)
# Or:  docker compose up --build

services:
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    environment:
      PORT: ${WEB_PORT:-5173}
    volumes:
      - ./tsconfig.base.json:/monorepo/tsconfig.base.json
      - ./packages/web:/monorepo/packages/web
      - ./packages/shared:/monorepo/packages/shared
      - /monorepo/packages/web/node_modules
      - /monorepo/packages/shared/node_modules
      - pnpm_store:/monorepo/node_modules

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    ports:
      - "${API_PORT:-3010}:3010"
    env_file:
      - ./.env
    environment:
      # Helps tsx watch detect synced file changes on Windows/macOS Docker volumes
      CHOKIDAR_USEPOLLING: "true"
    develop:
      watch:
        - action: sync
          path: ./packages/api
          target: /monorepo/packages/api
          ignore:
            - node_modules/
        - action: sync
          path: ./packages/shared
          target: /monorepo/packages/shared
          ignore:
            - node_modules/
        - action: rebuild
          path: ./packages/api/package.json
        - action: rebuild
          path: ./packages/shared/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
    volumes:
      - ./tsconfig.base.json:/monorepo/tsconfig.base.json
      - ./packages/api:/monorepo/packages/api
      - ./packages/shared:/monorepo/packages/shared
      - /monorepo/packages/api/node_modules
      - /monorepo/packages/shared/node_modules
      - pnpm_store:/monorepo/node_modules

volumes:
  pnpm_store:
